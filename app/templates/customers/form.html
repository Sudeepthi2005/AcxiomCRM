{% extends "base.html" %}{% block heading %}{{'Edit' if customer else 'Create'}} Customer{% endblock %}
{% block content %}<div class="card p-4"><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<div class="col-md-6"><label class="form-label">Customer Name *</label><input required maxlength="120" name="customer_name" class="form-control" value="{{customer.customer_name if customer else ''}}"></div>
<div class="col-md-6"><label class="form-label">Email *</label><input required type="email" name="email" class="form-control" value="{{customer.email if customer else ''}}"></div>
<div class="col-md-6"><label class="form-label">Phone *</label><input required pattern="[6-9][0-9]{9}" maxlength="10" name="phone" class="form-control" value="{{customer.phone if customer else ''}}"></div>
<div class="col-md-6"><label class="form-label">Company</label><input maxlength="120" name="company_name" class="form-control" value="{{customer.company_name if customer else ''}}"></div>
<div class="col-12"><label class="form-label">Address</label><input name="address" class="form-control" value="{{customer.address if customer else ''}}"></div>
<div class="col-md-6"><label>City</label><input name="city" class="form-control" value="{{customer.city if customer else ''}}"></div>
<div class="col-md-6"><label>State</label><input name="state" class="form-control" value="{{customer.state if customer else ''}}"></div>
<div class="col-md-6"><label>Status</label><select name="status" class="form-select"><option>Active</option><option {% if customer and customer.status=='Inactive' %}selected{% endif %}>Inactive</option></select></div>
<div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="{{url_for('customers.index')}}">Cancel</a></div></form></div>{% endblock %}
