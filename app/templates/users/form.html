{% extends "base.html" %}{% block heading %}Create User{% endblock %}
{% block content %}<div class="card p-4"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<label>Name</label><input required name="name" class="form-control mb-3">
<label>Email</label><input required type="email" name="email" class="form-control mb-3">
<label>Password</label><input required minlength="8" type="password" name="password" class="form-control mb-3">
<label>Role</label><select required name="role_id" class="form-select mb-3">{% for r in roles %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select>
<button class="btn btn-primary">Create</button></form></div>{% endblock %}
