{% extends "base.html" %}{% block heading %}Users & Roles{% endblock %}
{% block content %}<div class="d-flex justify-content-end mb-3"><a href="{{url_for('users.create')}}" class="btn btn-primary">+ Create User</a></div>
<div class="card p-3"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role_name}}</td><td>{{'Active' if u.is_active else 'Inactive'}}</td><td><form method="post" action="{{url_for('users.toggle',id=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-secondary">{{'Deactivate' if u.is_active else 'Activate'}}</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
